name: Build with Release configuration
on: push

jobs:
  Build_Release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Collect LFS file list
        shell: bash
        run: git lfs ls-files --long --exclude="Documentation,Source/Ports/Tests" | cut -d ' ' -f1 | sort > lfs-files.txt
      - name: Cache LFS files
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-build-${{ hashFiles('lfs-files.txt') }}
          restore-keys: |
            lfs-build-
      - name: Fetch LFS files needed to build
        run: git lfs pull --exclude="Documentation,Source/Ports/Tests"
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: nuget/setup-nuget@v4
      - name: Collect NuGet package references
        shell: bash
        run: grep -rh --include=*.csproj "PackageReference" Source | sort -u > nuget-packages.txt
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('nuget-packages.txt') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install dependencies
        run: nuget restore Source\NostalgicPlayer.sln
      - name: Build
        run: msbuild Source\NostalgicPlayer.sln -t:rebuild -property:configuration="Release" -property:Platform="Any CPU"
      - name: Rename binary directory
        run: move Source\Clients\NostalgicPlayer\bin\Release\net* NostalgicPlayer-dev-build-${{github.run_number}}
      - name: Cleanup runtimes
        run: |
          Get-ChildItem -Path "NostalgicPlayer-dev-build-${{github.run_number}}\runtimes" -Directory |
          Where-Object { $_.Name -ne "win-x64" } |
          ForEach-Object { Remove-Item -Path $_.FullName -Recurse -Force }
      - name: Create artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NostalgicPlayer-dev-build-${{github.run_number}}
          path: NostalgicPlayer-dev-build-*\
