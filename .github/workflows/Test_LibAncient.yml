name: Run unit test for LibAncient
on:
  workflow_dispatch:
  push:
    paths:
      - '**/LibAncient/**'
      - '**/LibAncient.Test/**'

jobs:
  Test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Collect LFS file list
        shell: bash
        run: |
          {
            git lfs ls-files --long --exclude="Documentation,Source/Ports/Tests"
            git lfs ls-files --long --include="Source/Ports/Tests/LibAncient.Test"
          } | cut -d ' ' -f1 | sort > lfs-files.txt
      - name: Cache LFS files
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-LibAncient-${{ hashFiles('lfs-files.txt') }}
          restore-keys: |
            lfs-LibAncient-
            lfs-build-
      - name: Fetch LFS files needed to build
        run: git lfs pull --exclude="Documentation,Source/Ports/Tests"
      - name: Fetch LFS test data
        run: git lfs pull --include="Source/Ports/Tests/LibAncient.Test"
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet
        uses: nuget/setup-nuget@v4
      - name: Collect NuGet package references
        shell: bash
        run: grep -rh --include=*.csproj "PackageReference" Source | sort -u > nuget-packages.txt
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('nuget-packages.txt') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install dependencies
        run: nuget restore Source\NostalgicPlayer.sln
      - name: Build
        run: msbuild Source\NostalgicPlayer.sln -t:rebuild -property:configuration="Debug" -property:Platform="Any CPU"
      - name: Test
        run: dotnet test Source\Ports\Tests\LibAncient.Test\LibAncient.Test.csproj --no-build --verbosity normal
